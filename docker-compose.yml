services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: smartbusg4-mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883" # Standard MQTT TCP Port
      - "9001:9001" # MQTT WebSockets Port
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  smartbusg4-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartbusg4-node-app
    restart: unless-stopped
    depends_on:
      - mqtt-broker
    # On Windows: Docker Desktop uses ports: (port 1900 is handled by start-alexa-ssdp.bat to prevent Windows SSDPSRV conflicts)
    # On Linux / Raspberry Pi: network_mode: host can be used directly for native Layer 2 SSDP broadcast
    ports:
      - "6080:3000"       # Web Dashboard & REST API
      - "80:80"        # SmartBus G4 SSDP Port
      - "6000:6000/udp"   # SmartBus G4 UDP Port
    environment:
      - PORT=3000
      - EXTERNAL_PORT=80
      - ALEXA_PORT=80
      - HOST_IP=${HOST_IP:-auto} # Central dynamic host network resolution (data/network.json)
      - UDP_PORT=6000
      - GATEWAY_IP=192.168.0.200
      - ZAUDIO_IP=192.168.0.200
      - MQTT_BROKER_URL=mqtt://mqtt-broker:1883
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
